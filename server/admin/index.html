<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSME Catalyst — Admin</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="js">

<!-- LOGIN -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="brand" style="justify-content:center;margin-bottom:8px">
      <img src="/assets/img/logo.png" alt="MSME Catalyst" style="height:52px">
    </div>
    <p class="center muted" style="margin-bottom:22px">Secretariat admin · role-based access</p>
    <form id="login-form" class="form">
      <div class="field"><label>Email</label><input class="input" id="li-email" type="email" value="admin@msmecatalyst.org" required></div>
      <div class="field"><label>Password</label><input class="input" id="li-pass" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-lg" type="submit">Sign in</button>
      <p id="li-err" class="muted" style="color:var(--danger);display:none"></p>
    </form>
    <p class="notice" style="margin-top:18px">Use the administrator email and password configured securely during deployment.</p>
  </div>
</div>

<!-- APP -->
<div id="app" class="admin-shell" style="display:none">
  <aside class="admin-side">
    <a class="brand" href="/" target="_blank"><img src="/assets/img/logo.png" alt="MSME Catalyst" style="height:34px"></a>
    <div class="side-role" id="side-role"></div>
    <nav id="side-nav" class="side-nav"></nav>
    <div class="side-foot">
      <a href="/" target="_blank" class="side-link">↗ View public site</a>
      <button id="logout" class="side-link" style="background:none;border:0;text-align:left;cursor:pointer">Sign out</button>
    </div>
  </aside>
  <main class="admin-main">
    <header class="admin-top">
      <div><h1 id="view-title" class="h3">Dashboard</h1><p class="muted" id="view-sub" style="margin:0;font-size:.9rem"></p></div>
      <div id="top-actions"></div>
    </header>
    <div id="view" class="admin-view"></div>
  </main>
</div>

<!-- MODAL -->
<div id="modal" class="modal" style="display:none">
  <div class="modal-card">
    <div class="modal-head"><h3 id="modal-title">Edit</h3><button id="modal-close" class="mclose">×</button></div>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-foot" class="modal-foot"></div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
