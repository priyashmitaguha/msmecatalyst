<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MSME Catalyst — Card Capture</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<link rel="stylesheet" href="admin.css">
<style>
  body { background: var(--sand, #f6f4ee); }
  .scan-wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 64px; }
  .scan-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0 16px; }
  .scan-top .who { font-size: .82rem; color: var(--muted, #5f6a62); text-align: right; }
  .scan-card { background: #fff; border: 1px solid var(--line, #e6e3da); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
  .scan-card h2 { font-family: var(--font-display, Sora), sans-serif; font-size: 1.05rem; margin: 0 0 4px; }
  .cap-btns { display: grid; gap: 10px; }
  .cap-btns .btn { width: 100%; justify-content: center; }
  .preview { margin-top: 12px; text-align: center; }
  .preview img { max-height: 220px; max-width: 100%; border-radius: 12px; border: 1px solid var(--line, #e6e3da); }
  .ocr-status { font-size: .85rem; color: var(--muted, #5f6a62); margin-top: 10px; min-height: 1.2em; }
  .field label { display: block; font-size: .8rem; font-weight: 600; margin: 0 0 4px; }
  .field { margin-bottom: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
  .checkrow { display: flex; align-items: flex-start; gap: 10px; font-size: .9rem; }
  .checkrow input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--green, #15803d); }
  .success { text-align: center; padding: 30px 10px; }
  .success .big { font-size: 2.6rem; }
  .msg { padding: 10px 12px; border-radius: 10px; font-size: .9rem; margin-top: 10px; }
  .msg.ok { background: #ecfdf3; color: #15803d; }
  .msg.warn { background: #fff7ed; color: #9a3412; }
  .msg.err { background: #fef2f2; color: #b91c1c; }
  .req { color: #b91c1c; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="scan-wrap">
  <div class="scan-top">
    <img src="/assets/img/logo.png" alt="MSME Catalyst" style="height:34px">
    <div class="who"><div id="who-name">…</div><a href="#" id="signout" style="color:var(--green,#15803d)">Sign out</a></div>
  </div>

  <div id="gate" class="scan-card"><p class="muted">Checking access…</p></div>

  <div id="app" class="hidden">
    <div class="scan-card">
      <h2>Capture a visiting card</h2>
      <p class="muted" style="font-size:.86rem;margin:0 0 12px">Take a photo or upload a card. Text is read on your device — the image is not uploaded or stored. Review every field before saving.</p>
      <div class="cap-btns">
        <label class="btn btn-primary btn-lg" for="cam">📷 Take photo of card</label>
        <input id="cam" type="file" accept="image/*" capture="environment" class="hidden">
        <label class="btn btn-ghost" for="pick">🖼️ Upload card image</label>
        <input id="pick" type="file" accept="image/*" class="hidden">
        <button class="btn btn-ghost" id="manual" type="button">✎ Enter manually</button>
      </div>
      <div class="preview hidden" id="preview">
        <img id="preview-img" alt="Card preview">
        <div class="ocr-status" id="ocr-status"></div>
        <div style="margin-top:10px"><button class="btn btn-ghost" id="retake" type="button">Retake / replace</button></div>
      </div>
    </div>

    <form id="form" class="scan-card hidden" autocomplete="off">
      <h2>Review &amp; correct</h2>
      <p class="muted" style="font-size:.84rem;margin:0 0 14px">OCR can be wrong — please check every field.</p>
      <div class="field"><label>Full name</label><input class="input" name="full_name"></div>
      <div class="grid2">
        <div class="field"><label>Designation</label><input class="input" name="designation"></div>
        <div class="field"><label>Organisation</label><input class="input" name="organisation"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Email</label><input class="input" name="email" type="email" inputmode="email"></div>
        <div class="field"><label>Mobile</label><input class="input" name="mobile" inputmode="tel"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Alternate number</label><input class="input" name="alternate" inputmode="tel"></div>
        <div class="field"><label>Website</label><input class="input" name="website" inputmode="url"></div>
      </div>
      <div class="field"><label>Address</label><input class="input" name="address"></div>
      <div class="grid2">
        <div class="field"><label>City</label><input class="input" name="city"></div>
        <div class="field"><label>State</label><input class="input" name="state"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Country</label><input class="input" name="country"></div>
        <div class="field"><label>LinkedIn URL</label><input class="input" name="linkedin" inputmode="url"></div>
      </div>
      <div class="field"><label>Areas of interest</label><input class="input" name="areas_of_interest"></div>
      <div class="field"><label>Notes</label><textarea class="textarea" name="notes" rows="2"></textarea></div>
      <div class="grid2">
        <div class="field"><label>Follow-up owner</label><input class="input" name="follow_up_owner"></div>
        <div class="field"><label>Follow-up date</label><input class="input" name="follow_up_date" type="date"></div>
      </div>
      <div class="field"><label>Event / source</label><select class="select" name="event_source" id="event_source"></select></div>
      <div class="field">
        <label class="checkrow"><input type="checkbox" name="consent" id="consent">
          <span>Send a thank-you email now. Only tick this after confirming the email address is correct and the person is happy to be contacted.</span></label>
      </div>
      <div id="form-msg" class="msg err hidden"></div>
      <button class="btn btn-primary btn-lg" type="submit" id="submit" style="width:100%;justify-content:center">Save to CRM</button>
    </form>
  </div>

  <div id="done" class="scan-card success hidden">
    <div class="big">✅</div>
    <h2 id="done-title">Saved</h2>
    <div id="done-msg" class="msg ok"></div>
    <div style="margin-top:18px"><button class="btn btn-primary btn-lg" id="another" type="button">Capture another card</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script src="scan.js"></script>
</body>
</html>
