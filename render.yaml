# Render Blueprint for the MSME Catalyst website, CMS and CRM.
services:
  - type: web
    name: msme-catalyst
    runtime: node
    rootDir: server
    plan: 0.5c-512mb
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /opt/render/project/src/server/persistent/data
      - key: UPLOAD_DIR
        value: /opt/render/project/src/server/persistent/uploads
      # Public base URL used to build password-reset links in emails.
      - key: APP_BASE_URL
        value: https://msmecatalyst.org
      # Outbound email (password reset). Leave unset to disable email;
      # reset links are then written to the CMS "email outbox" for an operator.
      # Set these securely in the Render dashboard (do NOT commit real values).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
    disk:
      name: msme-data
      mountPath: /opt/render/project/src/server/persistent
      sizeGB: 1